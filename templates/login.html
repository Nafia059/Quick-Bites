{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Foodpanda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/login.css' %}" rel="stylesheet">
</head>
<body class="bg-white text-dark">

<section class="vh-100 gradient-custom d-flex align-items-center justify-content-center">
  <div class="card p-4" style="border-radius: 12px; width: 100%; max-width: 450px;">
    <h3 class="text-center mb-4">Login</h3>
    <form method="POST">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          {{ field.label_tag }}
          {{ field }}
          {% if field.errors %}
            <div class="text-danger small">{{ field.errors }}</div>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-pink w-100">Login</button>
      <div class="text-center mt-3">
        <a href="{% url 'signup' %}" class="text-pink">Don't have an account? Sign up</a>
      </div>
    </form>
  </div>
</section>

</body>
</html>
