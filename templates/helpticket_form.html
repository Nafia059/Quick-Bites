<!DOCTYPE html>
<html>
<head>
    <title>Submit Help Ticket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        form input, form textarea, form button {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        form button {
            background-color: #20bf6b;
            color: white;
            border: none;
            cursor: pointer;
        }
        form button:hover {
            background-color: #1fa463;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Submit Help Ticket</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Send Ticket</button>
        </form>
    </div>
</body>
</html>
